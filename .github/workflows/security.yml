name: Hardened Security Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * 1'

permissions: read-all

jobs:
  security-checks:
    name: Scorecard & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4.1.3

      - name: "Secret Scan"
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: "Run OpenSSF Scorecard"
        uses: ossf/scorecard-action@0864cf19026789058feabb7e87baa5f140aac736 # v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The repository is a fork or does not have Advanced Security (code scanning)
      # enabled, so we suppress failures when trying to upload SARIF results.
      - name: "Upload SARIF results"
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1b1aada464948af03b950897e5eb522f92603cc2 # v3.24.9
        with:
          sarif_file: results.sarif

      - name: "Setup Node.js"
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20

      - name: "Setup pnpm"
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: "VEX Analysis (pnpm audit)"
        run: |
          cd researchquest
          pnpm install
          pnpm audit --json > pnpm-audit-vex.json || true
          cat pnpm-audit-vex.json
