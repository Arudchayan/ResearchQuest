name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR9 item 3: fail fast on Supabase env misconfiguration before install/build.
  env-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Assert Supabase env shape (fail fast)
        env:
          # CI builds the web app with no backend (demo/static gate; e2e
          # injects stub credentials at serve time). The guard still rejects
          # .env.example placeholder values and shapeless URLs whenever a URL
          # IS configured (e.g. via secrets).
          PLAYWRIGHT_TEST_NO_SUPABASE: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node researchquest/scripts/check-supabase-env.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [env-guard]
    defaults:
      run:
        working-directory: researchquest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.1
          package_json_file: researchquest/package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run -- --coverage

      - name: Build
        # Exercise the prod build path (build:prod == tsc + vite build;
        # dead BUILD_MODE/--mode prod flags removed, Vite defaults to production).
        run: pnpm run build:prod

      - name: Migration order lint
        run: pnpm run lint:migrations

      - name: Design-token gate
        run: pnpm run check:design-tokens

      - name: Bundle-size budget
        run: pnpm run check:bundle-budget

      - name: Supabase migration dry-run push (optional, guarded)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          if [ ! -f supabase/config.toml ]; then
            echo "SKIP: no supabase/config.toml (no linked project); the static order lint above is the gate."
            exit 0
          fi
          pnpm --dir researchquest exec supabase db push --dry-run

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke (no Supabase)
        run: pnpm run test:e2e

  # PR9 item 9: serve the production bundle and prove it boots.
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    defaults:
      run:
        working-directory: researchquest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.1
          package_json_file: researchquest/package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build (stub Supabase env, same as e2e)
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24ifQ.stub"
        run: pnpm run build

      - name: Preview smoke (vite preview + Playwright)
        run: |
          pnpm exec vite preview --port 4174 --host 127.0.0.1 --strictPort > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4174/ > /dev/null 2>&1 && break || sleep 2
          done
          curl --fail --silent http://127.0.0.1:4174/ > /dev/null
          pnpm run preview-smoke

  edge-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: API gateway unit tests
        run: deno test --allow-env supabase/functions/api/tests/

      - name: OpenAPI fixture present
        run: test -f supabase/functions/api/openapi.fixture.yaml

      - name: OpenAPI drift check (fixture vs generator)
        run: deno run --no-lock --allow-read supabase/functions/api/check_openapi_drift.ts
