# For details on Dependabot configuration, see:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm (pnpm) dependencies for the ResearchQuest frontend app
  - package-ecosystem: "npm"
    directory: "/researchquest"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    # Group non-major updates into a single PR to reduce noise
    # NOTE (SDC c82, 2026-08-18): the former dev-dependencies group was removed —
    # its patterns (typescript*, vite, eslint*, @types/*, @vitejs/*, vitest*,
    # @testing-library/*) funneled EVERY major bump into one blob PR (#674: 12 updates,
    # 7 majors incl. TS 5.6->7.0, vite 6->8, eslint 9->10). Such blob PRs are unmergeable
    # as-is and dependabot's rebase keeps them "up-to-date" (the majors are intended).
    # Per-package PRs gate+merge cleanly (11 merged in one sweep, cycle 76) — prefer them.
    groups:
      react-vendor:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix-ui:
        patterns:
          - "@radix-ui/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # Allow up to 5 PRs at a time for patch updates
    # (security updates are always auto-opened regardless of this limit)

  # GitHub Actions — keep workflows and Actions runners up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
