# ResearchQuest — Supabase CLI configuration.
#
# Requires Supabase CLI >= 2.116.0 (pinned via the `supabase` devDependency in
# researchquest/package.json; config.toml has no version field, so the pin
# lives there — keep this comment in sync when bumping the devDependency).

project_id = "researchquest"

[functions.api]
enabled = true
# Exception: keep platform JWT off. Unauthenticated discovery routes
# (GET /health, /v1/health, /openapi.json, /v1/openapi.json, /explore)
# plus dual auth on remaining routes: Bearer JWT OR Bearer rq_ API keys.
# rq_ tokens are not Supabase JWTs — verify_jwt=true would 401 API-key
# clients and public discovery. See docs/security/edge-function-jwt.md.
verify_jwt = false

[functions.fetch-paper]
enabled = true
# Platform JWT on (defense in depth). Handler still authenticates via
# supabase.auth.getUser(). Older comments that CORS preflight required
# verify_jwt off are outdated; the gateway allows OPTIONS with JWT on.
verify_jwt = true

[functions.deep-research]
enabled = true
# Same as fetch-paper: platform JWT on; in-handler getUser remains.
verify_jwt = true

[functions.create-admin-user]
enabled = true
# Retired 410 stub. Platform JWT on so the old Admin API path cannot return.
verify_jwt = true
