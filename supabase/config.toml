# ResearchQuest — Supabase CLI configuration.
#
# Requires Supabase CLI >= 2.116.0 (pinned via the `supabase` devDependency in
# researchquest/package.json; config.toml has no version field, so the pin
# lives there — keep this comment in sync when bumping the devDependency).

project_id = "researchquest"

[functions.api]
enabled = true
# Gateway auth + unauthenticated discovery (/health, /openapi.json, /explore).
# Production keeps platform JWT verification off; the function checks JWTs itself.
verify_jwt = false

[functions.fetch-paper]
enabled = true
# App-level JWT via supabase.auth.getUser. Platform verify_jwt stays off to
# match production (CORS preflight + getUser). Honour ALLOWED_ORIGINS.
verify_jwt = false

[functions.deep-research]
enabled = true
# Same as fetch-paper: self-verifies the caller JWT. Match production.
verify_jwt = false

[functions.create-admin-user]
enabled = true
# Retired 410 stub. Platform JWT on so the old Admin API path cannot return.
verify_jwt = true
